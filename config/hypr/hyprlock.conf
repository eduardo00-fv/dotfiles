# Lock screen — paleta Tinta, editorial y sobrio (es lo que ve la gente).
# Marco fino con detalles en las esquinas, reloj delgado, línea terracota
# y una frase de frases-thrain.txt en serif cursiva, como cita de libro.
# El fondo se desenfoca y oscurece para que todo se lea con cualquier wallpaper.

general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/thrain/Pictures/Walpapers/lockscreen-active.jpg
    blur_passes = 3
    blur_size = 7
    brightness = 0.5
    contrast = 0.9
    vibrancy = 0.12
}

# ---------- Marco ----------
shape {
    monitor =
    size = 1840, 1000
    color = rgba(00000000)
    rounding = 0
    border_size = 1
    border_color = rgba(ecdcc02e)
    position = 0, 0
    halign = center
    valign = center
}

# Esquinas (texto chico y espaciado)
label {
    monitor =
    text = <span letter_spacing="4096">THRAIN</span>
    color = rgba(bfae90cc)
    font_size = 10
    font_family = CaskaydiaCove Nerd Font
    position = 72, -64
    halign = left
    valign = top
}

label {
    monitor =
    text = <span letter_spacing="4096">SESIÓN BLOQUEADA</span>
    color = rgba(bfae90a0)
    font_size = 10
    font_family = CaskaydiaCove Nerd Font
    position = -72, -64
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:30000] echo "󰁹  $(cat /sys/class/power_supply/BAT1/capacity) %$(grep -q '^Charging' /sys/class/power_supply/BAT1/status && echo '  ·  cargando')"
    color = rgba(bfae90aa)
    font_size = 10
    font_family = CaskaydiaCove Nerd Font
    position = 72, 64
    halign = left
    valign = bottom
}

label {
    monitor =
    text = <span letter_spacing="4096">ARCH · HYPRLAND</span>
    color = rgba(bfae9078)
    font_size = 10
    font_family = CaskaydiaCove Nerd Font
    position = -72, 64
    halign = right
    valign = bottom
}

# ---------- Centro ----------
# Reloj
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(ecdcc0f2)
    font_size = 92
    font_family = CaskaydiaCove Nerd Font Light
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0d0b09cc)
    position = 0, 210
    halign = center
    valign = center
}

# Fecha en versalitas espaciadas
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing=\"5120\">$(~/.config/hypr/fecha-lock.sh)</span>"
    color = rgba(e2cda8d2)
    font_size = 11
    font_family = CaskaydiaCove Nerd Font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0d0b09cc)
    position = 0, 120
    halign = center
    valign = center
}

# Línea terracota
shape {
    monitor =
    size = 48, 2
    color = rgba(e0551fe6)
    rounding = 0
    border_size = 0
    position = 0, 61
    halign = center
    valign = center
}

# Frase para hacer "lock in" (frases-thrain.txt; cambia cada 5 min)
# Fraunces variable: peso 330 y SOFT 100 (serif suave, recta)
label {
    monitor =
    text = cmd[update:300000] echo "<span font_desc='Fraunces 21 @wght=330,SOFT=100'>“$(~/.config/hypr/frase-thrain.sh)”</span>"
    color = rgba(ecdcc0eb)
    font_size = 21
    font_family = Fraunces
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0d0b09dd)
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46
    rounding = 12
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(5e5245cc)
    inner_color = rgba(1d1a16cc)
    font_color = rgb(ecdcc0)
    font_family = CaskaydiaCove Nerd Font
    fade_on_empty = false
    fail_timeout = 4000
    placeholder_text = <span foreground="##8a7d6b">contraseña</span>
    check_color = rgba(e0551fcc)
    fail_color = rgb(b83a2e)
    fail_text = $FAIL ($ATTEMPTS)
    capslock_color = rgb(d9a441)
    numlock_color = -1
    position = 0, -110
    halign = center
    valign = center
}
