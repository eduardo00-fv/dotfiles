# Lock screen — paleta Tinta, sobria: todo en crema/arena sobre el fondo oscurecido.
# El fondo se desenfoca y oscurece para que el texto se lea con cualquier wallpaper.

general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/thrain/Pictures/Walpapers/lockscreen-active.jpg
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
    contrast = 0.9
    vibrancy = 0.12
}

# Reloj
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(ecdcc0f2)
    font_size = 92
    font_family = CaskaydiaCove Nerd Font Light
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0d0b09cc)
    position = 0, 230
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d de %B")"
    color = rgba(e2cda8dd)
    font_size = 19
    font_family = CaskaydiaCove Nerd Font
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0d0b09cc)
    position = 0, 140
    halign = center
    valign = center
}

# Frase para hacer "lock in" (frases-thrain.txt; cambia cada 5 min)
label {
    monitor =
    text = cmd[update:300000] echo "<i>$(~/.config/hypr/frase-thrain.sh)</i>"
    color = rgba(e2cda8e6)
    font_size = 16
    font_family = CaskaydiaCove Nerd Font
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0d0b09dd)
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46
    rounding = 12
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(5e5245cc)
    inner_color = rgba(1d1a16cc)
    font_color = rgb(ecdcc0)
    font_family = CaskaydiaCove Nerd Font
    fade_on_empty = false
    fail_timeout = 4000
    placeholder_text = <span foreground="##8a7d6b">contraseña</span>
    check_color = rgba(e0551fcc)
    fail_color = rgb(b83a2e)
    fail_text = $FAIL ($ATTEMPTS)
    capslock_color = rgb(d9a441)
    numlock_color = -1
    position = 0, -40
    halign = center
    valign = center
}

# Batería, abajo y discreta (lejos de la contraseña)
label {
    monitor =
    text = cmd[update:30000] echo "󰁹  $(cat /sys/class/power_supply/BAT1/capacity)%  ·  $(cat /sys/class/power_supply/BAT1/status | sed 's/Charging/cargando/;s/Discharging/con batería/;s/Full/llena/;s/Not charging/conectada/')"
    color = rgba(bfae90bb)
    font_size = 12
    font_family = CaskaydiaCove Nerd Font
    position = 0, 36
    halign = center
    valign = bottom
}
