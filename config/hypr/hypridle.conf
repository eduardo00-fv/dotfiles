general {
    lock_cmd = pidof hyprlock || hyprlock          # una sola instancia
    before_sleep_cmd = loginctl lock-session        # bloquea vía lock_cmd antes de suspender
    after_sleep_cmd = ~/.config/hypr/despertar-pantalla.sh   # apagar+prender: ver el script (despertares alternos en negro)
    inhibit_sleep = 3                               # no suspender hasta que hyprlock haya bloqueado de verdad
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}
