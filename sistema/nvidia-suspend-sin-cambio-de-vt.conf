# La pantalla la maneja la Intel (nvidia_drm modeset=0): el chvt 63 de nvidia-sleep.sh
# solo sirve para Xorg sobre NVIDIA, y aquí hace que Hyprland suelte y retome la
# pantalla en cada suspensión, dejando eDP-1 apagado en despertares alternos.
# Se conserva lo importante: avisar al driver para guardar la VRAM.
[Service]
ExecStart=
ExecStart=/bin/sh -c "echo suspend > /proc/driver/nvidia/suspend"
